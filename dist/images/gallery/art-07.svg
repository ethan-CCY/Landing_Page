<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="url(#paint0_linear)"/>
  <circle cx="300" cy="260" r="170" fill="url(#paint1_radial)" fill-opacity="0.7"/>
  <circle cx="520" cy="340" r="150" fill="url(#paint2_radial)" fill-opacity="0.7"/>
  <circle cx="620" cy="200" r="90" fill="url(#paint3_radial)" fill-opacity="0.6"/>
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6f8fb"/>
